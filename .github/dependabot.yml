# Dependabot version update configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/"
    # Monthly (not weekly) to cut PR volume. The schedule affects only version
    # updates; Dependabot security updates fire promptly regardless of cadence,
    # EXCEPT for packages under `ignore` below (ignore suppresses their security
    # update PRs too).
    schedule:
      interval: "monthly"

    ignore:
      # FluentAssertions 8.0.0+ switched to the XCEED commercial license.
      # Pin to the last free major (7.x); block automatic upgrades to 8.x.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]

      # ASP.NET Core OpenAPI and Asp.Versioning.OpenApi require Microsoft.OpenApi < 3.
      # Keep receiving compatible 2.x fixes until those consumers support 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

    # Group monthly NuGet bumps so the schedule produces a handful of PRs
    # instead of 20+ unrelated single-package PRs.
    groups:
      microsoft-platform:
        # EF Core depends on matching Microsoft.Extensions patch versions. Keep
        # them together so central transitive pins cannot cause NU1109 downgrades.
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.OpenApi"
          - "Microsoft.IdentityModel.*"
          - "Microsoft.Identity.*"
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis.*"
          - "Roslynator.*"
      testing:
        # xunit.v3 4.x, TRX 2.x and current coverage extensions share MTP 2.
        # Update them together; the old MTP 1 coverage restriction no longer applies.
        patterns:
          - "xunit*"
          - "Xunit.*"
          - "Microsoft.Testing.*"
          - "FluentAssertions"
          - "Moq"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      api-versioning:
        patterns:
          - "Asp.Versioning.*"
      scalar:
        patterns:
          - "Scalar.*"
      # Catch-all MUST stay last: Dependabot assigns each package to the first
      # group whose patterns match, so this folds every remaining ungrouped
      # package (Nerdbank.GitVersioning, T4.Build, Stateless, SQLitePCLRaw,
      # Microsoft.Extensions.DependencyModel, etc.) into one PR.
      other:
        patterns:
          - "*"
