name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, release/v** ]
  pull_request:
    branches: [ main ]

# Dependabot PRs run with a read-only GITHUB_TOKEN by default. The
# EnricoMi/publish-unit-test-result-action step calls POST /check-runs
# (needs `checks: write`) and may comment on PRs (`pull-requests: write`).
# Without this explicit block, the action 403s on every dependabot PR
# even when the build + tests themselves are green.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup versioning
      run: |
        dotnet tool install --global nbgv
        nbgv cloud

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: API reference audits (TRLDOC005, TRLDOC008, TRLDOC014, TRLDOC015)
      # Reflects over the just-built assemblies to check the doc<->API relationship in both
      # directions, and fails on any of them.
      #   TRLDOC005 — every API-shaped name in the reference docs resolves to a real symbol.
      #     Catches a confidently-documented type that was renamed or never existed; the
      #     completeness direction cannot see those, because such a symbol has no counterpart
      #     in the assemblies to start from.
      #   TRLDOC008 — every public type and member is named in its package's reference doc.
      #     Catches new API shipping undocumented. These totals were printed but unenforced for
      #     a long time, which let 8 types and 33 members accumulate in a green build; the
      #     process exit code now covers both audits, not just TRLDOC005.
      #   TRLDOC014 — every receiver-qualified member access in a C# fence resolves on the type
      #     it is written against. TRLDOC005 validates each dotted segment independently and
      #     only reads backticked prose, so Error.Validation.ForField passed it on the strength  # v1-stale-ok: cites a made-up API as the motivating defect
      #     of an unrelated Validation and a real ForField — inside a fence it never looked at
      #     all. Fenced code is what readers copy, so it is held to binding-like resolution.
      #   TRLDOC015 — a member name listed in ambiguous-members.txt must name its receiver in
      #     prose. When Error lost ReasonCode but FieldViolation and RuleViolation kept theirs,
      #     ten "use its ReasonCode" references stayed green: the name still resolves for
      #     TRLDOC005, the surviving members keep TRLDOC008 satisfied, and a bare name has no
      #     receiver for TRLDOC014 to check. This is the only audit that also reads articles/.
      run: |
        dotnet run -c Release --project docs/docfx_project/api_reference/audit-completeness/audit-completeness.csproj
      env:
        TRELLIS_FW_ROOT: ${{ github.workspace }}

    - name: Discard generated completeness report
      # The auditor writes completeness-report.md into the directory DocFX later builds; drop it
      # so the published docs and packed payload stay byte-identical to a local build.
      if: always()
      run: rm -f docs/docfx_project/api_reference/completeness-report.md

    - name: API reference payload probe
      # Packs a real package, restores it into scratch consumers outside this repository and
      # asserts which .github directory the docs land in. TRLDOC004 proves a doc is PACKED; only
      # this proves it is DELIVERED, exercising the .git-bounded directory walk that no unit test
      # can reach.
      shell: pwsh
      run: ./build/test-apireference-payload.ps1 -Configuration Release

    - name: Test with Coverage
      # --coverage: Native MTP coverage (requires Microsoft.Testing.Extensions.CodeCoverage)
      # --report-trx: Native MTP TRX generation (requires Microsoft.Testing.Extensions.TrxReport)
      # --results-directory is a VSTest-only flag that forces the VSTest code path, breaking MTP flags.
      # MTP writes TRX to TestResults/ relative to each test project directory; coverage path is set explicitly via --coverage-output.
      run: |
        dotnet test --no-build -c Release \
          --filter-not-trait "Category=Integration" \
          --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml \
          --report-trx

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/TestResults/**/*.trx

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
      if: always()
      with:
        # MTP writes coverage relative to each test project; search recursively
        files: ./**/*.cobertura.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: AOT publish gate (Showcase.MinimalApi)
      # Proves Trellis.Core + Trellis.Asp + Trellis.FluentValidation + Trellis.Mediator
      # publish cleanly under NativeAOT. Any new IL2026/IL3050/etc. warning fails the build.
      # EF Core integration is intentionally excluded (see Trellis.EntityFrameworkCore README).
      run: |
        dotnet publish Examples/Showcase/src/Showcase.MinimalApi/Showcase.MinimalApi.csproj \
          -c Release -r linux-x64 \
          /p:PublishAot=true \
          /p:TreatWarningsAsErrors=true

    - name: AOT publish gate (bare non-ASP console)
      # The Showcase gate above references Trellis.Asp, which roots the scalar-value surface
      # and so keeps IScalarValue<,> alive through trimming. A console app using only
      # Trellis.Core + Trellis.Primitives has nothing doing that rooting and trims differently
      # -- the one configuration proven to behave differently under AOT, and previously
      # uncovered. Publishes with warnings-as-errors, then runs the native binary: the probe
      # asserts scalar value objects still round-trip and that the composite converter, which
      # is allowed to fail here, fails with a message naming the cause and the remedy.
      run: |
        dotnet publish Examples/AotConsoleProbe/AotConsoleProbe.csproj \
          -c Release -r linux-x64 \
          /p:PublishAot=true \
          /p:TreatWarningsAsErrors=true
        Examples/AotConsoleProbe/bin/Release/net10.0/linux-x64/publish/AotConsoleProbe

    - name: Showcase runtime smoke tests (AOT MinimalApi + JIT MVC)
      # Proves both Showcase samples actually serve traffic. Catches runtime
      # regressions that build/publish-time analysis cannot see — e.g., anonymous
      # types in ProblemDetails extensions, missing JsonSerializerContext entries,
      # reflection inside [UnconditionalSuppressMessage] blocks, MVC formatter
      # misconfiguration. Exercises both a success path (JSON serialization) and
      # a 4xx path (ResponseFailureWriter rules array) for each sample so a
      # regression in either fails CI.
      shell: bash
      run: |
        set -euo pipefail

        # --- Reusable smoke probe: launch a sample, assert one happy + one failure path ---
        # Args: <label> <port> <log-file> <launch-command...>
        run_smoke() {
          local LABEL=$1 PORT=$2 LOG=$3
          shift 3
          echo "==================== ${LABEL} ===================="

          local APP_PID=""
          ASPNETCORE_URLS="http://127.0.0.1:${PORT}" ASPNETCORE_ENVIRONMENT=Production "$@" > "$LOG" 2>&1 &
          APP_PID=$!
          cleanup_smoke() {
            if [ -n "${APP_PID:-}" ]; then
              kill "${APP_PID}" 2>/dev/null || true
              wait "${APP_PID}" 2>/dev/null || true
            fi
            echo "--- ${LABEL} log ---"
            cat "${LOG}" || true
          }
          # Ensure cleanup even when set -e exits the script before the function returns.
          trap cleanup_smoke RETURN EXIT

          echo "Waiting for ${LABEL} (pid ${APP_PID}) on port ${PORT}..."
          local i
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 1 "http://127.0.0.1:${PORT}/api/accounts/" 2>/dev/null; then
              echo "  up after ${i} attempt(s)"
              break
            fi
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "${LABEL} host exited before becoming ready"
              return 1
            fi
            sleep 0.5
          done

          echo "--- Happy path: GET /api/accounts/ ---"
          local HAPPY_STATUS
          HAPPY_STATUS=$(curl -s -o "${LABEL}-happy.json" -w '%{http_code}' "http://127.0.0.1:${PORT}/api/accounts/")
          if [ "$HAPPY_STATUS" != "200" ]; then
            echo "Expected 200, got ${HAPPY_STATUS}"
            cat "${LABEL}-happy.json" || true
            return 1
          fi
          echo "  200 OK; body head: $(head -c 200 ${LABEL}-happy.json)"

          echo "--- Failure path: POST /api/accounts/{id}/deposit with zero amount -> 4xx ProblemDetails ---"
          local FAIL_STATUS
          FAIL_STATUS=$(curl -s -o "${LABEL}-fail.json" -w '%{http_code}' \
            -H 'content-type: application/json' \
            -X POST --data '{"amount":{"amount":0,"currency":"USD"}}' \
            "http://127.0.0.1:${PORT}/api/accounts/aaaaaaa1-0000-0000-0000-000000000000/deposit")
          case "$FAIL_STATUS" in
            400|422) ;;
            *)
              echo "Expected 400 or 422, got ${FAIL_STATUS}"
              cat "${LABEL}-fail.json" || true
              return 1
              ;;
          esac
          # Body must be non-empty JSON ProblemDetails.
          if ! grep -qE '"(title|detail|errors|status)"' "${LABEL}-fail.json"; then
            echo "${LABEL} failure response lacks ProblemDetails fields:"
            cat "${LABEL}-fail.json"
            return 1
          fi
          # A zero deposit is a field violation, so the response must carry the
          # structured extension. This is the assertion that actually exercises
          # polymorphic serialization of FieldViolationProblemDetail[] out of the
          # object-valued Extensions dictionary -- the one thing native AOT needs a
          # [JsonSerializable] root for and cannot degrade gracefully without.
          # The generic check above passes on "title" alone and would not catch it.
          if ! grep -q '"fieldViolations"' "${LABEL}-fail.json"; then
            echo "${LABEL} failure response lacks fieldViolations; a JsonSerializerContext entry is likely missing:"
            cat "${LABEL}-fail.json"
            return 1
          fi
          echo "  ${FAIL_STATUS} OK; body head: $(head -c 300 ${LABEL}-fail.json)"

          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true
          APP_PID=""
          trap - RETURN EXIT
          echo "=== ${LABEL} smoke test passed ==="
        }

        # --- AOT MinimalApi: published native binary ---
        AOT_BIN=Examples/Showcase/src/Showcase.MinimalApi/bin/Release/net10.0/linux-x64/publish/Showcase.MinimalApi
        if [ ! -x "$AOT_BIN" ]; then
          echo "AOT binary not found: $AOT_BIN"
          ls -la "$(dirname "$AOT_BIN")" || true
          exit 1
        fi
        run_smoke "MinimalApi-AOT" 5099 minimalapi-aot.log "$AOT_BIN"

        # --- JIT MVC: managed binary from the existing Release build ---
        # MVC is intentionally not AOT-published (controller binding + filter
        # pipeline are not currently AOT-supported). The smoke test runs the
        # JIT-compiled assembly to prove the sample actually serves traffic.
        MVC_DLL=Examples/Showcase/src/Showcase.Mvc/bin/Release/net10.0/Showcase.Mvc.dll
        if [ ! -f "$MVC_DLL" ]; then
          echo "MVC assembly not found: $MVC_DLL"
          ls -la "$(dirname "$MVC_DLL")" || true
          exit 1
        fi
        run_smoke "Mvc-JIT" 5100 mvc-jit.log dotnet "$MVC_DLL"

    - name: Update doc tools
      run: dotnet tool update -g docfx

    - name: Build docs
      run: docfx docs/docfx_project/docfx.json
  
    # Runs on pull requests too, not just pushes to main. Package validation - including the
    # API-compatibility check against the last published release - executes during pack, so
    # gating this on the push would mean a breaking change first surfaced after merge, or at
    # publish time. Only the artifact upload stays push-only.
    - name: Pack
      if: ${{ success() }}
      run: dotnet pack --no-build --verbosity normal -c Release -o artifacts/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ success() && !github.base_ref }}
      with:
        name: artifact
        path: artifacts/
