name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, release/v** ]
  pull_request:
    branches: [ main ]

# Dependabot PRs run with a read-only GITHUB_TOKEN by default. The
# EnricoMi/publish-unit-test-result-action step calls POST /check-runs
# (needs `checks: write`) and may comment on PRs (`pull-requests: write`).
# Without this explicit block, the action 403s on every dependabot PR
# even when the build + tests themselves are green.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  encoding-policy:
    name: Encoding policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Test encoding policy
      shell: pwsh
      run: ./build/test-encoding-policy.ps1

    - name: Verify tracked-file encodings
      shell: pwsh
      run: ./build/verify-encoding.ps1

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup versioning
      run: |
        dotnet tool install --global nbgv
        nbgv cloud

    - name: Verify reason-code guard source scope
      shell: bash
      run: |
        set -euo pipefail
        # The compiler guard follows source projects under src. Retain the layout safeguard
        # so a reorganization cannot make CI pass without analyzing the intended source scope.
        FILE_COUNT=$(git ls-files -- '*/src/*.cs' | wc -l)
        if [ "$FILE_COUNT" -lt 100 ]; then
          echo "::error::The reason-code guard source scope contains only $FILE_COUNT files. Update the semantic guard for the changed repository layout."
          exit 1
        fi
        echo "Semantic reason-code guard source scope: $FILE_COUNT files."

    - name: Restore dependencies
      run: dotnet restore

    - name: Build reason-code analyzer
      run: dotnet build Trellis.Analyzers/src/Trellis.Analyzers.csproj --no-restore -c Release

    - name: Build with semantic reason-code guard
      run: dotnet build --no-restore -c Release -p:TrellisEnableReasonCodeGuard=true

    - name: API reference audits (TRLDOC005, TRLDOC008, TRLDOC014, TRLDOC015)
      # Reflects over the just-built assemblies to check the doc<->API relationship in both
      # directions, and fails on any of them.
      #   TRLDOC005 — every API-shaped name in the reference docs resolves to a real symbol.
      #     Catches a confidently-documented type that was renamed or never existed; the
      #     completeness direction cannot see those, because such a symbol has no counterpart
      #     in the assemblies to start from.
      #   TRLDOC008 — every public type and member has structured, exact-identifier evidence
      #     in its package's reference doc; prose, metadata, and substrings cannot vouch for it.
      #     Catches new API shipping undocumented. These totals were printed but unenforced for
      #     a long time, which let 8 types and 33 members accumulate in a green build; the
      #     process exit code now covers both audits, not just TRLDOC005.
      #   TRLDOC014 — C# fence chains and standalone inline Type.Member names resolve on the
      #     receiving type. Calls/signatures and unqualified prose stay outside inline ownership.
      #     TRLDOC005 validates each dotted segment independently and
      #     only reads backticked prose, so Error.Validation.ForField passed it on the strength  # v1-stale-ok: cites a made-up API as the motivating defect
      #     of an unrelated Validation and a real ForField — inside a fence it never looked at
      #     all. Inline Error.ReasonCode likewise passes flat-name/attribution checks despite
      #     belonging only to FieldViolation/RuleViolation. Localized historical/negative-space
      #     exceptions do not waive C# fences or another inline occurrence.
      #   TRLDOC015 — a member name listed in ambiguous-members.txt must name its receiver in
      #     prose. When Error lost ReasonCode but FieldViolation and RuleViolation kept theirs,
      #     ten "use its ReasonCode" references stayed green: the name still resolves for
      #     TRLDOC005, the surviving members keep TRLDOC008 satisfied, and a bare name has no
      #     receiver for TRLDOC014 to check. This is the only audit that also reads articles/.
      run: |
        dotnet run -c Release --project docs/docfx_project/api_reference/audit-completeness/audit-completeness.csproj
      env:
        TRELLIS_FW_ROOT: ${{ github.workspace }}

    - name: API reference payload probe
      # Packs the real payload and verifies its guidance manifest against package bytes.
      # Restore/build must not copy documentation into a consumer repository.
      # CLI lifecycle coverage now runs in the independent AgentDocs repository.
      shell: pwsh
      run: ./build/test-apireference-payload.ps1 -Configuration Release

    - name: Independent satellite guidance probe
      shell: pwsh
      run: ./build/test-satellite-guidance.ps1

    - name: Test with Coverage
      # --coverage: Native MTP coverage (requires Microsoft.Testing.Extensions.CodeCoverage)
      # --report-trx: Native MTP TRX generation (requires Microsoft.Testing.Extensions.TrxReport)
      # MTP 2 test modules can share a TestResults directory. Keep the generated unique
      # filenames: a fixed --coverage-output would make parallel modules overwrite or lock it.
      run: |
        dotnet test --no-build -c Release \
          --filter-not-trait "Category=Integration" \
          --coverage --coverage-output-format cobertura \
          --report-trx

    - name: Run SQL Server specifications without skips
      id: sqlserver_integration
      timeout-minutes: 8
      env:
        TRELLIS_TEST_SQLSERVER: testcontainers
      run: >-
        dotnet test --project Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj
        --no-build -c Release
        --filter-class Trellis.EntityFrameworkCore.Tests.SpecificationTests
        --filter-display-name '*SqlServer*'
        --fail-skips on --minimum-expected-tests 15
        --report-trx --results-directory TestResults/sqlserver-integration
        --no-progress --no-ansi

    - name: Run Service Bus integration tests without skips
      # Runs even when the SQL lane failed, so one run reports both integration lanes.
      if: ${{ !cancelled() && steps.sqlserver_integration.conclusion != 'skipped' }}
      timeout-minutes: 8
      env:
        TRELLIS_TEST_SERVICEBUS: testcontainers
      run: >-
        dotnet test --project Trellis.Messaging.AzureServiceBus/tests/Trellis.Messaging.AzureServiceBus.Tests.csproj
        --no-build -c Release
        --filter-class Trellis.Messaging.AzureServiceBus.Tests.ServiceBusTransportIntegrationTests
        --fail-skips on --minimum-expected-tests 6
        --report-trx --results-directory TestResults/servicebus-integration
        --no-progress --no-ansi

    - name: Container integration diagnostics
      if: failure()
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p TestResults/container-diagnostics
        for fixture in sqlserver-specifications servicebus-integration; do
          docker ps -a --no-trunc --filter "label=trellis.testcontainers-fixture=$fixture" \
            | tee "TestResults/container-diagnostics/$fixture-containers.log"
          docker network ls --no-trunc --filter "label=trellis.testcontainers-fixture=$fixture" \
            | tee "TestResults/container-diagnostics/$fixture-networks.log"
        done

    - name: Clean up owned container resources
      if: always()
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        cleanup_status=0
        for fixture in sqlserver-specifications servicebus-integration; do
          docker ps -aq --filter "label=trellis.testcontainers-fixture=$fixture" \
            | xargs -r docker rm -f || cleanup_status=$?
          docker network ls -q --filter "label=trellis.testcontainers-fixture=$fixture" \
            | xargs -r docker network rm || cleanup_status=$?
        done
        exit "$cleanup_status"

    - name: Upload container integration results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: container-integration-results
        path: |
          TestResults/sqlserver-integration
          TestResults/servicebus-integration
          TestResults/container-diagnostics
          Trellis.EntityFrameworkCore/tests/bin/Release/*/TestResults/sqlserver-integration
          Trellis.Messaging.AzureServiceBus/tests/bin/Release/*/TestResults/servicebus-integration

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          **/TestResults/**/*.trx

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
      if: always()
      with:
        # Collect every module's uniquely named coverage report.
        files: ./**/*.cobertura.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

    - name: AOT publish gate (Showcase.MinimalApi)
      # Proves Trellis.Core + Trellis.Asp + Trellis.FluentValidation + Trellis.Mediator
      # publish cleanly under NativeAOT. Any new IL2026/IL3050/etc. warning fails the build.
      # EF Core integration is intentionally excluded (see Trellis.EntityFrameworkCore README).
      run: |
        dotnet publish Examples/Showcase/src/Showcase.MinimalApi/Showcase.MinimalApi.csproj \
          -c Release -r linux-x64 \
          /p:PublishAot=true \
          /p:TreatWarningsAsErrors=true

    - name: Native scalar converter contract smoke (Showcase.MinimalApi)
      run: Examples/Showcase/src/Showcase.MinimalApi/bin/Release/net10.0/linux-x64/publish/Showcase.MinimalApi --scalar-converter-smoke

    - name: AOT publish gate (bare non-ASP console)
      # The Showcase gate above references Trellis.Asp, which roots the scalar-value surface
      # and so keeps IScalarValue<,> alive through trimming. A console app using only
      # Trellis.Core + Trellis.Primitives has nothing doing that rooting and trims differently
      # -- the one configuration proven to behave differently under AOT, and previously
      # uncovered. Publishes with warnings-as-errors, then runs the native binary: the probe
      # asserts scalar value objects still round-trip and that the composite converter, which
      # is allowed to fail here, fails with a message naming the cause and the remedy.
      run: |
        dotnet publish Examples/AotConsoleProbe/AotConsoleProbe.csproj \
          -c Release -r linux-x64 \
          /p:PublishAot=true \
          /p:TreatWarningsAsErrors=true
        Examples/AotConsoleProbe/bin/Release/net10.0/linux-x64/publish/AotConsoleProbe

    - name: Native actor-handler generated-dispatch contracts
      run: |
        for consumer in ActorHandlers.Consumer ActorHandlers.GeneratedPipeline; do
          project="Trellis.Mediator/generator-tests/$consumer"
          dotnet publish "$project/$consumer.csproj" \
            -c Release -r linux-x64 \
            /p:PublishAot=true \
            /p:TreatWarningsAsErrors=true
          "$project/bin/Release/net10.0/linux-x64/publish/$consumer"
        done

    - name: Showcase runtime smoke tests (AOT MinimalApi + JIT MVC)
      # Proves both Showcase samples actually serve traffic. Catches runtime
      # regressions that build/publish-time analysis cannot see — e.g., anonymous
      # types in ProblemDetails extensions, missing JsonSerializerContext entries,
      # reflection inside [UnconditionalSuppressMessage] blocks, MVC formatter
      # misconfiguration. Also covers Production binding failures through the
      # collecting enum/composite converters, not just handler-level failures.
      shell: bash
      run: |
        set -euo pipefail

        assert_body_rejection() {
          local LABEL=$1 PORT=$2 NAME=$3 PAYLOAD=$4 EXPECTED_STATUS=$5 CODE=$6 POINTER=$7 ARGS=$8
          local BODY="${LABEL}-${NAME}.json" RESPONSE
          RESPONSE=$(curl -sS --max-time 15 -o "$BODY" -w '%{http_code}|%{content_type}' \
            -H 'content-type: application/json' -X POST --data "$PAYLOAD" \
            "http://127.0.0.1:${PORT}/api/accounts")
          python3 - "$BODY" "$RESPONSE" "$EXPECTED_STATUS" "$CODE" "$POINTER" "$ARGS" <<'PY'
        import json
        import sys

        path, response, expected_status, code, pointer, args = sys.argv[1:]
        status, content_type = response.split("|", 1)

        def require(condition, message):
            if not condition:
                raise SystemExit(f"{path}: {message}")

        require(status == expected_status, f"expected HTTP {expected_status}, got {status}")
        require(content_type.split(";", 1)[0].strip().lower() == "application/problem+json",
                f"expected Problem Details media type, got {content_type!r}")
        with open(path, encoding="utf-8") as body:
            problem = json.load(body)
        require(problem["status"] == int(expected_status), "body status disagrees with HTTP")
        require(problem["code"] == "error.unspecified", "unexpected envelope reason")
        expected_kind = "bad-request" if expected_status == "400" else "unprocessable-content"
        require(problem["kind"] == expected_kind, f"expected kind {expected_kind}")
        if code:
            violations = problem["fieldViolations"]
            require(len(violations) == 1, "expected exactly one field violation")
            violation = violations[0]
            require(violation["code"] == code, f"expected field reason {code}")
            require(violation["location"] == {"in": "body", "pointer": pointer},
                    f"expected body pointer {pointer}")
            require(violation["args"] == json.loads(args), "field renderer arguments changed")
            require(isinstance(violation.get("detail"), str) and violation["detail"].strip(),
                    "field detail must be non-empty, not identical across producers")
        print(f"{path}: {status} Problem Details contract passed")
        PY
        }

        # --- Reusable smoke probe: launch a sample and exercise its HTTP producers ---
        # Args: <label> <port> <log-file> <launch-command...>
        run_smoke() {
          local LABEL=$1 PORT=$2 LOG=$3
          shift 3
          echo "==================== ${LABEL} ===================="

          local APP_PID=""
          ASPNETCORE_URLS="http://127.0.0.1:${PORT}" ASPNETCORE_ENVIRONMENT=Production "$@" > "$LOG" 2>&1 &
          APP_PID=$!
          cleanup_smoke() {
            if [ -n "${APP_PID:-}" ]; then
              kill "${APP_PID}" 2>/dev/null || true
              wait "${APP_PID}" 2>/dev/null || true
            fi
            echo "--- ${LABEL} log ---"
            cat "${LOG}" || true
          }
          # Ensure cleanup even when set -e exits the script before the function returns.
          trap cleanup_smoke RETURN EXIT

          echo "Waiting for ${LABEL} (pid ${APP_PID}) on port ${PORT}..."
          local i
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null --max-time 1 "http://127.0.0.1:${PORT}/api/accounts/" 2>/dev/null; then
              echo "  up after ${i} attempt(s)"
              break
            fi
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "${LABEL} host exited before becoming ready"
              return 1
            fi
            sleep 0.5
          done

          echo "--- Happy path: GET /api/accounts/ ---"
          local HAPPY_STATUS
          HAPPY_STATUS=$(curl -s -o "${LABEL}-happy.json" -w '%{http_code}' "http://127.0.0.1:${PORT}/api/accounts/")
          if [ "$HAPPY_STATUS" != "200" ]; then
            echo "Expected 200, got ${HAPPY_STATUS}"
            cat "${LABEL}-happy.json" || true
            return 1
          fi
          echo "  200 OK; body head: $(head -c 200 ${LABEL}-happy.json)"

          echo "--- Failure path: POST /api/accounts/{id}/deposit with zero amount -> 4xx ProblemDetails ---"
          local FAIL_STATUS
          FAIL_STATUS=$(curl -s -o "${LABEL}-fail.json" -w '%{http_code}' \
            -H 'content-type: application/json' \
            -X POST --data '{"amount":{"amount":0,"currency":"USD"}}' \
            "http://127.0.0.1:${PORT}/api/accounts/aaaaaaa1-0000-0000-0000-000000000000/deposit")
          case "$FAIL_STATUS" in
            400|422) ;;
            *)
              echo "Expected 400 or 422, got ${FAIL_STATUS}"
              cat "${LABEL}-fail.json" || true
              return 1
              ;;
          esac
          # Body must be non-empty JSON ProblemDetails.
          if ! grep -qE '"(title|detail|errors|status)"' "${LABEL}-fail.json"; then
            echo "${LABEL} failure response lacks ProblemDetails fields:"
            cat "${LABEL}-fail.json"
            return 1
          fi
          # A zero deposit is a field violation, so the response must carry the
          # structured extension. This is the assertion that actually exercises
          # polymorphic serialization of FieldViolationProblemDetail[] out of the
          # object-valued Extensions dictionary -- the one thing native AOT needs a
          # [JsonSerializable] root for and cannot degrade gracefully without.
          # The generic check above passes on "title" alone and would not catch it.
          if ! grep -q '"fieldViolations"' "${LABEL}-fail.json"; then
            echo "${LABEL} failure response lacks fieldViolations; a JsonSerializerContext entry is likely missing:"
            cat "${LABEL}-fail.json"
            return 1
          fi
          echo "  ${FAIL_STATUS} OK; body head: $(head -c 300 ${LABEL}-fail.json)"

          assert_body_rejection "$LABEL" "$PORT" "unknown-enum" \
            '{"customerId":"11111111-1111-1111-1111-111111111111","accountType":"Platinum","initialDeposit":{"amount":250,"currency":"USD"},"dailyWithdrawalLimit":{"amount":500,"currency":"USD"},"overdraftLimit":{"amount":0,"currency":"USD"}}' \
            422 "enum.name-undefined" "/accountType" '{"allowed":["Checking","MoneyMarket","Savings"]}'
          assert_body_rejection "$LABEL" "$PORT" "negative-money" \
            '{"customerId":"11111111-1111-1111-1111-111111111111","accountType":"Checking","initialDeposit":{"amount":-100,"currency":"USD"},"dailyWithdrawalLimit":{"amount":500,"currency":"USD"},"overdraftLimit":{"amount":0,"currency":"USD"}}' \
            422 "value.greater-than-or-equal" "/initialDeposit/amount" '{"comparisonValue":0}'
          assert_body_rejection "$LABEL" "$PORT" "malformed-json" '{' 400 "" "" '{}'

          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true
          APP_PID=""
          trap - RETURN EXIT
          echo "=== ${LABEL} smoke test passed ==="
        }

        # --- AOT MinimalApi: published native binary ---
        AOT_BIN=Examples/Showcase/src/Showcase.MinimalApi/bin/Release/net10.0/linux-x64/publish/Showcase.MinimalApi
        if [ ! -x "$AOT_BIN" ]; then
          echo "AOT binary not found: $AOT_BIN"
          ls -la "$(dirname "$AOT_BIN")" || true
          exit 1
        fi
        run_smoke "MinimalApi-AOT" 5099 minimalapi-aot.log "$AOT_BIN"

        # --- JIT MVC: managed binary from the existing Release build ---
        # MVC is intentionally not AOT-published (controller binding + filter
        # pipeline are not currently AOT-supported). The smoke test runs the
        # JIT-compiled assembly to prove the sample actually serves traffic.
        MVC_DLL=Examples/Showcase/src/Showcase.Mvc/bin/Release/net10.0/Showcase.Mvc.dll
        if [ ! -f "$MVC_DLL" ]; then
          echo "MVC assembly not found: $MVC_DLL"
          ls -la "$(dirname "$MVC_DLL")" || true
          exit 1
        fi
        run_smoke "Mvc-JIT" 5100 mvc-jit.log dotnet "$MVC_DLL"

    # Runs on pull requests too, not just pushes to main. Package validation - including the
    # API-compatibility check against the last published release - executes during pack, so
    # gating this on the push would mean a breaking change first surfaced after merge, or at
    # publish time. Only the artifact upload stays push-only.
    - name: Pack
      if: ${{ success() }}
      run: dotnet pack --no-build --verbosity normal -c Release -o artifacts/
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      if: ${{ success() && !github.base_ref }}
      with:
        name: artifact
        path: artifacts/
