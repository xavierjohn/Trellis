name: Documentation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the documentation site to GitHub Pages
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.props'
      - '**/*.targets'
      - '**/*.slnx'
      - '**/*.tt'
      - 'global.json'
      - '.github/workflows/documentation.yml'
      - '.github/workflows/validate-documentation.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docs:
    # Main PRs use Build's required docs gate; preserve checks for other PR targets.
    if: github.event_name == 'workflow_dispatch' || github.base_ref != 'main'
    uses: ./.github/workflows/validate-documentation.yml
    with:
      upload_site: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish }}

  deploy-docs:
    needs: publish-docs
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Download documentation site
      uses: actions/download-artifact@v8
      with:
        name: documentation-site
        path: documentation-site

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: documentation-site
        force_orphan: true
