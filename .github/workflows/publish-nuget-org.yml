name: Publish to NuGet.org

# Dispatch from main or a release/v* branch. The build job rebuilds, tests and packs that
# commit (as xavierjohn/Trellis.Microservices does); the publish job pushes exactly those
# packages through the approval-protected `nuget` environment.
# NuGet.org must trust this workflow in the nuget environment for Trellis.*.
# Configure the NuGet profile name as the environment variable NUGET_USER.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test and pack without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # needed for nbgv

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Require the Build quality gate for this commit
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        conclusion=$(gh api "repos/$REPOSITORY/commits/$COMMIT/check-runs?check_name=build&filter=latest" \
          --jq '[.check_runs[] | select(.app.slug == "github-actions")] | first | .conclusion // "missing"')
        if [ "$conclusion" != "success" ]; then
          echo "::error::The required 'build' check for $COMMIT is '$conclusion'. Wait for Build to pass on this commit, then dispatch again."
          exit 1
        fi

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup versioning
      run: |
        dotnet tool install --global nbgv
        nbgv cloud

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore -c Release

    - name: Run tests
      run: dotnet test --no-build -c Release --filter-not-trait "Category=Integration"

    - name: Pack
      run: dotnet pack --no-build -c Release -o nupkgs

    # The pinned SBOM tool targets .NET 8; library builds still use global.json.
    - name: Setup SBOM runtime
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '8.0.x'

    - name: Install SBOM tool
      run: dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5

    - name: Generate SBOM
      shell: pwsh
      run: |
        $packagesDirectory = Join-Path $PWD 'nupkgs'
        $sbomDirectory = Join-Path $PWD 'sbom'
        $dropDirectory = Join-Path $sbomDirectory 'drop'

        New-Item -ItemType Directory -Force -Path $dropDirectory | Out-Null

        $packageFiles = Get-ChildItem -Path $packagesDirectory -Filter *.nupkg
        if ($packageFiles.Count -eq 0) {
          throw 'No NuGet packages were produced for SBOM generation.'
        }
        Copy-Item -Path $packageFiles.FullName -Destination $dropDirectory -Force

        $packageVersion = (nbgv get-version -v NuGetPackageVersion).Trim()

        sbom-tool generate `
          -b $dropDirectory `
          -bc $PWD `
          -pn 'Trellis' `
          -pv $packageVersion `
          -ps 'Xavier John' `
          -nsb 'https://github.com/xavierjohn/Trellis/sbom' `
          -m $sbomDirectory `
          -mi SPDX:3.0 `
          -D true `
          -V Information
        if ($LASTEXITCODE -ne 0) {
          throw 'SBOM generation failed.'
        }

    - name: List packages
      run: |
        echo "Packages to be published:"
        ls -lh nupkgs/*.nupkg

    - name: Upload SBOMs
      uses: actions/upload-artifact@v7
      with:
        name: sbom-spdx
        path: sbom/_manifest/**
        if-no-files-found: error

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: nupkgs
        path: nupkgs/
        if-no-files-found: error
        retention-days: 7

    - name: Dry run summary
      if: ${{ inputs.dry_run }}
      run: |
        echo "DRY RUN - Packages NOT published."
        echo "To publish for real, re-run with dry_run = false and approve the nuget deployment."

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: nuget
    concurrency:
      group: nuget-org-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download packages
      uses: actions/download-artifact@v8
      with:
        name: nupkgs
        path: nupkgs

    - name: NuGet login with OIDC
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to NuGet
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "nupkgs/*.nupkg" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
