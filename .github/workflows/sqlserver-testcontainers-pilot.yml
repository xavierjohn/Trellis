name: SQL Server Testcontainers pilot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sqlserver-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore and build while pulling the SQL Server image
      shell: bash
      run: |
        set -euo pipefail
        (
          TIMEFORMAT='SQL Server image pull: %3R seconds'
          time docker pull --quiet mcr.microsoft.com/mssql/server:2025-CU10-ubuntu-24.04
        ) &
        sql_pull=$!

        build_status=0
        {
          dotnet restore Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj &&
          dotnet build Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj --no-restore -c Release
        } || build_status=$?

        pull_status=0
        wait "$sql_pull" || pull_status=$?
        if [ "$pull_status" -ne 0 ]; then
          echo "::error::SQL Server image pull failed"
          exit "$pull_status"
        fi
        exit "$build_status"

    - name: Run SQL Server specifications without skips
      timeout-minutes: 8
      env:
        TRELLIS_TEST_SQLSERVER: testcontainers
      run: >-
        dotnet test --project Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj
        --no-build -c Release
        --filter-class Trellis.EntityFrameworkCore.Tests.SpecificationTests
        --filter-display-name '*SqlServer*'
        --fail-skips on --minimum-expected-tests 15
        --report-trx --results-directory TestResults/sqlserver-pilot
        --no-progress --no-ansi

    - name: Docker diagnostics
      if: failure()
      timeout-minutes: 1
      run: docker ps -a --no-trunc --filter label=trellis.testcontainers-pilot=sqlserver-specifications

    - name: Upload pilot results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sqlserver-testcontainers-pilot-results
        path: |
          TestResults/sqlserver-pilot
          Trellis.EntityFrameworkCore/tests/bin/Release/*/TestResults/sqlserver-pilot
