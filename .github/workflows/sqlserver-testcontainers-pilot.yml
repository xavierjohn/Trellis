name: SQL Server Testcontainers pilot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sqlserver-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj

    - name: Build pilot tests
      run: dotnet build Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj --no-restore -c Release

    - name: Run SQL Server specifications without skips
      timeout-minutes: 8
      env:
        TRELLIS_TEST_SQLSERVER: testcontainers
      run: >-
        dotnet test --project Trellis.EntityFrameworkCore/tests/Trellis.EntityFrameworkCore.Tests.csproj
        --no-build -c Release
        --filter-class Trellis.EntityFrameworkCore.Tests.SpecificationTests
        --filter-display-name '*SqlServer*'
        --fail-skips on --minimum-expected-tests 15
        --report-trx --results-directory TestResults/sqlserver-pilot
        --no-progress --no-ansi

    - name: Docker diagnostics
      if: failure()
      timeout-minutes: 1
      run: docker ps -a --no-trunc --filter label=trellis.testcontainers-pilot=sqlserver-specifications

    - name: Upload pilot results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sqlserver-testcontainers-pilot-results
        path: |
          TestResults/sqlserver-pilot
          Trellis.EntityFrameworkCore/tests/bin/Release/*/TestResults/sqlserver-pilot
